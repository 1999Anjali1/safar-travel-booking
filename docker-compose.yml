# Full stack: PostgreSQL + ASP.NET Core API + Angular (nginx)
#   docker compose up --build    then open http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: safar
      POSTGRES_USER: safar
      POSTGRES_PASSWORD: safar_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safar -d safar"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=safar;Username=safar;Password=safar_dev_password"
      Jwt__Key: "docker-compose-demo-signing-key-change-me-0123456789"
      Cors__Origins__0: "http://localhost:8080"
      # Optional: set GROQ_API_KEY in your shell or a .env file to turn on the AI trip planner
      Ai__ApiKey: "${GROQ_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5080:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
