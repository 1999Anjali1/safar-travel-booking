# Public entry point through ingress-nginx, HTTPS certificate from cert-manager + Let's Encrypt
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safar
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # SignalR WebSockets
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [safar.example.com]
      secretName: safar-tls
  rules:
    - host: safar.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
