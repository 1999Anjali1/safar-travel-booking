- name: Check whether Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false
  failed_when: false

- name: Install Docker Engine and the Compose plugin from Ubuntu's repository
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
  when: docker_version.rc != 0

- name: Start Docker on boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Rotate container logs (10 MB x 3 files per container)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker
  tags: [docker_daemon]

- name: Let the deploy user run docker
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
